#   mdl mutate moodle-aiplacement_dimensions moodle-aiplacement_dimensions/mutations/gates.conf --fast --branch MOODLE_503_STABLE --db pgsql
#   mdl mutate moodle-aiplacement_dimensions moodle-aiplacement_dimensions/mutations/gates.conf --fast --branch MOODLE_503_STABLE --db mariadb
