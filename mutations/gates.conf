S2_budget_moved | classes/local/prompt.php | s2_budget_moved.pl
#   -> test_the_readme_states_the_limits_of_what_is_sent

S3_idnumber_in_prompt | classes/local/prompt.php | s3_idnumber_in_prompt.pl
#   -> test_the_prompt_carries_short_names_and_content_only

# .gitattributes: what the release package carries.
R1_licence_left_out | .gitattributes | r1_licence_left_out.pl
