name: ci

on:
  push:
    # Filtered to the merge targets. Without this, a push to a feature branch
    # ran the whole pipeline AND the pull_request event ran it again on the same
    # commit - double, for no extra information.
    branches:
      - main
      - 'MOODLE_*_STABLE'
  pull_request:
  workflow_dispatch:

# Supersede a run when new commits arrive on the same pull request: pushing
# three fixes in a row otherwise leaves three full pipelines running to the end.
# Never on main - each merge there is the only run its commit will ever get, and
# a second merge landing quickly must not cancel the first one's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One reusable-workflow call per supported Moodle branch (version.php
  # $plugin->supported). MOODLE_503_STABLE does not exist upstream yet; add its
  # leg when the branch appears, so the top of the declared range is tested.
  ci-502:
    name: Moodle 5.02
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_502_STABLE
      plugin-dependencies: |
        uaiblaine/moodle-local_dimensions,main

  ci-501:
    name: Moodle 5.01
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_501_STABLE
      one-db-only: true
      plugin-dependencies: |
        uaiblaine/moodle-local_dimensions,main
